<!-- Menu Toggle Button (visible quand le menu est fermé) -->
<button class="menu-toggle" id="menuToggle" title="Ouvrir le menu">&#9776;</button>

<!-- Side Menu -->
<div class="side-menu" id="sideMenu">
    <div class="menu-header" id="menuHeader" title="Fermer le menu">
        <h2>Tradiaries <span class="collapse-arrow">&#8592;</span></h2>
    </div>
    
    <ul class="menu-list">
        <!-- Dashboard -->
        <li>
            <a href="{% url 'dashboard:index' %}">📊 Dashboard</a>
        </li>
        
        <!-- Investissements -->
        <li>
            <a href="{% url 'investment:index' %}">💰 Investissements</a>
        </li>
        
        <!-- Trading Spot -->
        <li>
            <a href="{% url 'spot_trading:index' %}">🟢 Trading Spot</a>
        </li>
        
        <!-- Trading Futures -->
        <li>
            <a href="{% url 'futures_trading:index' %}">📈 Trading Futures</a>
        </li>
        
        <!-- Analytics -->
        <li>
            <a href="{% url 'analytics:index' %}">📉 Analytics</a>
        </li>
        
        <!-- Journal -->
        <li>
            <a href="{% url 'journal:index' %}">📝 Journal</a>
        </li>

        <!-- Trading Live -->
        <li>
            <a href="{% url 'live_trading:index' %}">⚡ Trading Live</a>
        </li>
        
        <!-- Paramètres -->
        <li>
            <a href="{% url 'settings:index' %}">⚙️ Paramètres</a>
        </li>
    </ul>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const menuToggle = document.getElementById('menuToggle');
    const menuHeader = document.getElementById('menuHeader');
    const sideMenu = document.getElementById('sideMenu');
    const mainContent = document.querySelector('.main-content');

    function closeMenu() {
        sideMenu.classList.add('hidden');
        menuToggle.classList.add('visible');
        if (mainContent) {
            mainContent.classList.add('expanded');
        }
    }

    function openMenu() {
        sideMenu.classList.remove('hidden');
        menuToggle.classList.remove('visible');
        if (mainContent) {
            mainContent.classList.remove('expanded');
        }
    }

    menuToggle.addEventListener('click', openMenu);
    menuHeader.addEventListener('click', closeMenu);

    // Handle submenu clicks
    const submenuTriggers = document.querySelectorAll('.submenu-trigger');
    submenuTriggers.forEach(trigger => {
        trigger.addEventListener('click', function(e) {
            e.preventDefault();
            const parent = this.parentElement;
            parent.classList.toggle('open');
        });
    });
    
    // Close menu on mobile when clicking a link
    if (window.innerWidth <= 768) {
        const links = sideMenu.querySelectorAll('a:not(.submenu-trigger)');
        links.forEach(link => {
            link.addEventListener('click', closeMenu);
        });
    }
});
</script>
