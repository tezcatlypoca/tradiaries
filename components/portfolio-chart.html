<div class="chart-controls">
    <div class="chart-timeframe-buttons">
        <button type="button" class="chart-timeframe-btn" data-range="1D">1D</button>
        <button type="button" class="chart-timeframe-btn" data-range="1W">1W</button>
        <button type="button" class="chart-timeframe-btn" data-range="1M">1M</button>
        <button type="button" class="chart-timeframe-btn" data-range="1Y">1Y</button>
        <button type="button" class="chart-timeframe-btn active" data-range="ALL">All</button>
    </div>
    <div class="chart-category-buttons">
        <button type="button" class="chart-category-btn" data-category="investment">Investment</button>
        <button type="button" class="chart-category-btn" data-category="spot">Spot</button>
        <button type="button" class="chart-category-btn" data-category="futures">Futures</button>
        <button type="button" class="chart-category-btn active" data-category="all">All</button>
    </div>
</div>
<div id="portfolio-chart" style="width: 100%; height: 400px;"></div>

<style>
    .chart-controls {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
    }
    .chart-timeframe-buttons,
    .chart-category-buttons {
        display: flex;
        gap: 6px;
        padding: 4px;
        background: var(--surface-1, #0e141b);
        border: 1px solid var(--border, #273542);
        border-radius: 6px;
        width: fit-content;
    }
    .chart-timeframe-btn,
    .chart-category-btn {
        padding: 6px 12px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: transparent;
        color: var(--text-secondary, #91a3ad);
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        transition: background 0.2s ease, color 0.2s ease;
    }
    .chart-timeframe-btn:hover,
    .chart-category-btn:hover {
        color: var(--text-primary, #f1f7f5);
    }
    .chart-timeframe-btn.active,
    .chart-category-btn.active {
        background: var(--primary-color, #67e8c1);
        border-color: var(--primary-color, #67e8c1);
        color: #07100e;
    }
    #portfolio-chart {
        background: var(--surface-1, #0e141b);
        border: 1px solid var(--border, #273542);
        border-radius: 6px;
    }
</style>

<script src="https://unpkg.com/lightweight-charts@4/dist/lightweight-charts.standalone.production.js"></script>
<script>
    const container = document.getElementById('portfolio-chart');
    const chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
            textColor: '#91a3ad',
            background: { color: 'transparent' },
            attributionLogo: false,
        },
        grid: {
            vertLines: { visible: false },
            horzLines: { visible: false },
        },
        rightPriceScale: {
            borderVisible: false,
        },
        timeScale: {
            borderVisible: false,
            timeVisible: true,
            secondsVisible: false,
        },
        crosshair: {
            vertLine: { color: '#273542', labelBackgroundColor: '#192430' },
            horzLine: { color: '#273542', labelBackgroundColor: '#192430' },
        },
    });

    const lineSeries = chart.addLineSeries({
        color: '#67e8c1',
        lineWidth: 2,
    });

    // Format des données: { investment: [{time, value}, ...], spot: [...], futures: [...], all: [...] }
    const chartDataByCategory = {{ chart_data|default:"{}"|safe }};

    let currentRange = 'ALL';
    let currentCategory = 'all';

    function filterDataByRange(data, range) {
        if (range === 'ALL' || data.length === 0) {
            return data;
        }
        const fromDate = new Date(data[data.length - 1].time);
        switch (range) {
            case '1D': fromDate.setDate(fromDate.getDate() - 1); break;
            case '1W': fromDate.setDate(fromDate.getDate() - 7); break;
            case '1M': fromDate.setMonth(fromDate.getMonth() - 1); break;
            case '1Y': fromDate.setFullYear(fromDate.getFullYear() - 1); break;
        }
        return data.filter(d => new Date(d.time) >= fromDate);
    }

    function render() {
        const categoryData = chartDataByCategory[currentCategory] || [];
        lineSeries.setData(filterDataByRange(categoryData, currentRange));
        chart.timeScale().fitContent();
    }

    const timeframeButtons = document.querySelectorAll('.chart-timeframe-btn');
    timeframeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            timeframeButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentRange = btn.dataset.range;
            render();
        });
    });

    const categoryButtons = document.querySelectorAll('.chart-category-btn');
    categoryButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            categoryButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = btn.dataset.category;
            render();
        });
    });

    if ((chartDataByCategory[currentCategory] || []).length > 0) {
        render();
    }

    window.addEventListener('resize', () => {
        if (container.clientWidth > 0) {
            chart.applyOptions({ width: container.clientWidth });
        }
    });
</script>
