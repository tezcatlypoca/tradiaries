<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Tradiaries</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <h2 class="auth-brand">Tradiaries</h2>
            <h1>Connexion</h1>
            {% if form.errors %}<p class="auth-error">Nom d'utilisateur ou mot de passe incorrect.</p>{% endif %}
            <form method="post" class="auth-form">
                {% csrf_token %}
                {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn-primary auth-submit">Se connecter</button>
            </form>
        </div>
    </main>
</body>
</html>
